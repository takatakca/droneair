name: Drone Air CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "codex/**"
      - "claude/**"
      - "feature/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Lovable runtime is fully removed
        shell: bash
        run: |
          if grep -R -n -E '@lovable\.dev|ai\.gateway\.lovable\.dev|__lovable|LOVABLE_API_KEY' \
            src package.json bun.lock vite.config.ts bunfig.toml 2>/dev/null; then
            echo "Obsolete Lovable runtime dependency/reference detected."
            exit 1
          fi
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env must not be tracked."
            exit 1
          fi
          if grep -R -n -E "DRONE R[’'.]?AIR|info@dronair\.ca|https://dronair\.ca|droneair\.lovable\.app|href=[\"']#[\"']" \
            src public README.md docs 2>/dev/null; then
            echo "Obsolete brand/domain or placeholder link detected."
            exit 1
          fi

      # Build first so TanStack's file-route generator refreshes routeTree.gen.ts
      # before the standalone TypeScript pass sees new routes.
      - name: Production build
        run: bun run build

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint
