name: Remove Lovable Dependencies

on:
  push:
    branches:
      - codex/final-production-2026-10-10
    paths:
      - ".github/workflows/remove-lovable-deps.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/final-production-2026-10-10

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Remove obsolete direct Lovable dependencies
        run: |
          bun remove @lovable.dev/email-js
          bun remove --dev @lovable.dev/vite-tanstack-config eslint-plugin-prettier eslint-config-prettier
          python - <<'PY'
          from pathlib import Path
          p = Path("bunfig.toml")
          text = p.read_text()
          lines = [line for line in text.splitlines() if not line.startswith("minimumReleaseAgeExcludes")]
          p.write_text("\n".join(lines).rstrip() + "\n")
          PY

      - name: Commit regenerated dependency metadata
        run: |
          if git diff --quiet; then
            echo "No dependency cleanup required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock bunfig.toml
          git commit -m "chore: remove obsolete Lovable dependencies"
          git push origin HEAD:codex/final-production-2026-10-10
