name: Drone Air CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "codex/**"
      - "claude/**"
      - "feature/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Lovable runtime is fully removed
        shell: bash
        run: |
          if grep -R -n -E '@lovable\.dev|ai\.gateway\.lovable\.dev|__lovable|LOVABLE_API_KEY' \
            src package.json bun.lock vite.config.ts bunfig.toml 2>/dev/null; then
            echo "Obsolete Lovable runtime dependency/reference detected."
            exit 1
          fi
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env must not be tracked."
            exit 1
          fi
          if grep -R -n -E "DRONE R[’'.]?AIR|info@dronair\.ca|https://dronair\.ca|droneair\.lovable\.app|href=[\"']#[\"']" \
            src public README.md docs 2>/dev/null; then
            echo "Obsolete brand/domain or placeholder link detected."
            exit 1
          fi

      # Build first so TanStack's file-route generator refreshes routeTree.gen.ts
      # before the standalone TypeScript pass sees new routes.
      - name: Production build
        run: bun run build

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Authorization regression tests
        run: bun test tests

  container:
    name: Coolify container build
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CI placeholders only; this image is never pushed to any registry.
      # The real public Supabase URL and publishable key must be supplied
      # as Coolify build arguments before any production deployment.
      - name: Build deployment image (not published)
        run: |
          docker build -f Dockerfile.coolify \
            --build-arg VITE_SUPABASE_URL=https://example.supabase.co \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=ci-placeholder-not-production \
            --build-arg DRONE_AIR_GIT_SHA="${GITHUB_SHA}" \
            -t drone-air:ci .

      - name: Smoke-test running HTTP application (not production)
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name drone-air-ci-runtime \
            --publish 127.0.0.1:18080:3000 \
            --env SUPABASE_URL=https://example.supabase.co \
            --env SUPABASE_PUBLISHABLE_KEY=ci-placeholder-not-production \
            --env SUPABASE_SERVICE_ROLE_KEY=ci-placeholder-not-production \
            drone-air:ci
          trap 'docker logs --tail 50 drone-air-ci-runtime || true; docker rm --force drone-air-ci-runtime || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          DRONE_AIR_EXPECTED_SHA="${GITHUB_SHA}" node scripts/smoke-http.mjs http://127.0.0.1:18080
