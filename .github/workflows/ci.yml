name: Drone Air CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "codex/**"
      - "claude/**"
      - "feature/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build first so TanStack's file-route generator refreshes routeTree.gen.ts
      # before the standalone TypeScript pass sees new routes.
      - name: Production build
        run: bun run build

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint
